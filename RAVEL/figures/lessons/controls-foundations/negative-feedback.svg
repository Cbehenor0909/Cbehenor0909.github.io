<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 335" role="img" aria-labelledby="title desc">
  <title id="title">Negative feedback subtracts the returned signal at the input junction</title>
  <desc id="desc">The reference r enters the plus port of a summing junction. The returned output passes through H and enters the minus port. The resulting error e drives G, whose output is y. The takeoff copies y without subtracting it.</desc>
  <defs><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2269B0"/></marker></defs>
  <rect x="1" y="1" width="478" height="333" rx="10" fill="#FFFFFF" stroke="#D4DEE8"/>
  <g font-family="Arial, sans-serif" fill="#172B42" font-size="28">
    <text x="24" y="36">Subtract the returned signal</text>
    <text x="24" y="95" fill="#2269B0">r</text>
    <path d="M24 115H70" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <path d="M125 115H179" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <path d="M300 115H439" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <circle cx="100" cy="115" r="24" fill="#FFFFFF" stroke="#172B42" stroke-width="2"/>
    <text x="59" y="97">+</text>
    <text x="66" y="170" fill="#B93C3B">−</text>
    <text x="150" y="96" fill="#2269B0">e</text>
    <rect x="187" y="82" width="105" height="66" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="2"/>
    <text x="239" y="125" text-anchor="middle">G</text>
    <text x="439" y="95" fill="#2269B0">y</text>
    <circle cx="384" cy="115" r="5" fill="#2269B0"/>
    <path d="M384 115V239H301" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <path d="M188 239H100V146" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <rect x="196" y="206" width="97" height="66" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="2"/>
    <text x="244" y="249" text-anchor="middle">H</text>
    <text x="140" y="313" fill="#2269B0">e = r − H y</text>
  </g>
</svg>
