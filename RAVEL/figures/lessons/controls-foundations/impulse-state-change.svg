<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
  <title id="title">A force impulse changes velocity without instantly changing displacement</title>
  <desc id="desc">An ideal force impulse has area one newton second. Applied to the one kilogram mass spring damper initially at rest, it changes velocity by one metre per second. Position is continuous through the impulse. The impulse arrow represents area, not a finite force height.</desc>
  <defs>
    <marker id="force" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#B93C3B"/></marker>
    <marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2269B0"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="408" rx="10" fill="#FFFFFF" stroke="#D4DEE8"/>
  <g font-family="Arial, sans-serif" fill="#172B42" font-size="28">
    <text x="24" y="35" font-size="26">From rest: q = 0, v = 0</text>
    <path d="M35 163H158" stroke="#56697C" stroke-width="2"/>
    <path d="M85 163V89" stroke="#B93C3B" stroke-width="4" marker-end="url(#force)"/>
    <text x="145" y="193">t</text>
    <text x="24" y="219" fill="#B93C3B">Area 1 N·s</text>
    <path d="M177 140H236" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <rect x="250" y="93" width="194" height="128" rx="5" fill="#EAF0F6" stroke="#172B42" stroke-width="2"/>
    <text x="347" y="126" text-anchor="middle">Mass + spring</text>
    <text x="347" y="157" text-anchor="middle">+ damper</text>
    <text x="347" y="198" text-anchor="middle">m = 1 kg</text>
    <path d="M347 221V256H134V283" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <path d="M347 256V283" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#signal)"/>
    <rect x="24" y="292" width="206" height="91" rx="5" fill="#FAF2DD" stroke="#966007"/>
    <rect x="250" y="292" width="206" height="91" rx="5" fill="#EAF0F6" stroke="#2269B0"/>
    <text x="127" y="326" text-anchor="middle" fill="#966007">Velocity jumps</text>
    <text x="127" y="360" text-anchor="middle">Δv = 1 m/s</text>
    <text x="353" y="326" text-anchor="middle" fill="#2269B0">q continuous</text>
    <text x="353" y="360" text-anchor="middle">Δq = 0</text>
  </g>
</svg>
