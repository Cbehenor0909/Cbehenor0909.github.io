<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="title desc">
  <title id="title">Two decaying modes in the damped mass state plane</title>
  <desc id="desc">Position is the horizontal axis and velocity is the vertical axis. Eigenvectors v1 equal one minus one and v2 equal one minus two identify two straight state directions. Blue motion arrows point toward the origin because both eigenvalues are negative. The initial state is one metre of displacement and zero velocity.</desc>
  <defs>
    <marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56697C"/></marker>
    <marker id="motion" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2269B0"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="458" rx="10" fill="#FFFFFF" stroke="#D4DEE8"/>
  <g font-family="Arial, sans-serif" fill="#172B42" font-size="28">
    <text x="24" y="36" font-size="26">State plane: q and v</text>
    <path d="M70 102H448" fill="none" stroke="#56697C" stroke-width="2" marker-end="url(#axis)"/>
    <path d="M70 402V56" fill="none" stroke="#56697C" stroke-width="2" marker-end="url(#axis)"/>
    <text x="407" y="137">q (m)</text>
    <text x="18" y="67">v</text>
    <text x="15" y="93" font-size="20">(m/s)</text>
    <text x="43" y="128">O</text>
    <path d="M70 102L210 242M70 102L210 382" stroke="#2269B0" stroke-width="3" fill="none"/>
    <path d="M173 205L131 163" stroke="#2269B0" stroke-width="4" fill="none" marker-end="url(#motion)"/>
    <path d="M180 322L154 270" stroke="#2269B0" stroke-width="4" fill="none" marker-end="url(#motion)"/>
    <circle cx="210" cy="102" r="7" fill="#966007"/>
    <text x="175" y="75" fill="#966007">x<tspan baseline-shift="sub" font-size="17">0</tspan> = (1, 0)</text>
    <path d="M210 102V382" stroke="#D4DEE8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="228" y="239" fill="#2269B0">v<tspan baseline-shift="sub" font-size="17">1</tspan> = (1, −1)</text>
    <text x="228" y="271">λ<tspan baseline-shift="sub" font-size="17">1</tspan> = −1 s<tspan baseline-shift="super" font-size="17">−1</tspan></text>
    <text x="228" y="366" fill="#2269B0">v<tspan baseline-shift="sub" font-size="17">2</tspan> = (1, −2)</text>
    <text x="228" y="398">λ<tspan baseline-shift="sub" font-size="17">2</tspan> = −2 s<tspan baseline-shift="super" font-size="17">−1</tspan></text>
    <text x="24" y="438">Each mode returns to O.</text>
  </g>
</svg>
