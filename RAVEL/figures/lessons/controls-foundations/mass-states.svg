<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
  <title id="title">States, force input and outputs of a mass spring damper</title>
  <desc id="desc">A mass m connects to a fixed wall through a spring of stiffness k and a damper of coefficient c. A red applied force acts toward positive displacement. Position and velocity are highlighted as the two state variables. Acceleration is determined by the states and the current force.</desc>
  <defs>
    <marker id="force" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#B93C3B"/></marker>
    <marker id="motion" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2269B0"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="438" rx="10" fill="#FFFFFF" stroke="#D4DEE8"/>
  <g font-family="Arial, sans-serif" fill="#172B42" font-size="28">
    <text x="24" y="36" font-size="26">One mass, two stored states</text>
    <path d="M42 94V264M27 107L42 94M27 142L42 129M27 177L42 164M27 212L42 199M27 247L42 234" fill="none" stroke="#56697C" stroke-width="3"/>
    <path d="M42 150H81L94 135L111 165L128 135L145 165L162 135L179 165L192 150H255" fill="none" stroke="#172B42" stroke-width="3"/>
    <text x="103" y="110">k (N/m)</text>
    <path d="M42 230H115M115 214V246H165V214H115M150 230H255" fill="none" stroke="#172B42" stroke-width="3"/>
    <text x="91" y="281">c (N·s/m)</text>
    <rect x="255" y="119" width="120" height="141" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="3"/>
    <text x="315" y="190" text-anchor="middle">m (kg)</text>
    <path d="M375 147H447" fill="none" stroke="#B93C3B" stroke-width="4" marker-end="url(#force)"/>
    <text x="383" y="111" fill="#B93C3B">u (N)</text>
    <path d="M255 305H415" fill="none" stroke="#2269B0" stroke-width="3" marker-end="url(#motion)"/>
    <text x="272" y="338" fill="#2269B0">Positive q, v</text>
    <rect x="24" y="365" width="206" height="53" rx="4" fill="#FAF2DD" stroke="#966007"/>
    <rect x="250" y="365" width="206" height="53" rx="4" fill="#FAF2DD" stroke="#966007"/>
    <text x="127" y="400" text-anchor="middle" fill="#966007">x<tspan baseline-shift="sub" font-size="17">1</tspan> = q (m)</text>
    <text x="353" y="400" text-anchor="middle" fill="#966007">x<tspan baseline-shift="sub" font-size="17">2</tspan> = v (m/s)</text>
  </g>
</svg>
