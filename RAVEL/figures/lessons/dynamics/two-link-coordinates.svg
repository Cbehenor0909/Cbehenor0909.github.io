<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" role="img" aria-labelledby="title desc">
<title id="title">Two-link configuration and tip kinematics</title><desc id="desc">Two unit links form a right angle at q1 equal to zero and q2 equal to ninety degrees. The tip at one, one meters has velocity leftward and upward and acceleration mainly downward, despite zero joint angular accelerations.</desc>
<defs>
<marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#172B42"/></marker>
<marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2269B0"/></marker>
<marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B93C3B"/></marker>
<marker id="ochre" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#966007"/></marker>
</defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;font-size:20px;fill:#172B42} .heading{font-size:22px;font-weight:600} .muted{fill:#56697C} .blue{fill:#2269B0} .red{fill:#B93C3B} .ochre{fill:#966007} .axis{stroke:#172B42;stroke-width:2;fill:none;marker-end:url(#dark)} .geometry{stroke:#172B42;stroke-width:3;fill:#EAF0F6} .velocity{stroke:#2269B0;stroke-width:3;fill:none;marker-end:url(#blue)} .force{stroke:#B93C3B;stroke-width:3;fill:none;marker-end:url(#red)} .guide{stroke:#A9B8C7;stroke-width:1.8;stroke-dasharray:6 5;fill:none} .highlight{stroke:#966007;stroke-width:3;fill:none;marker-end:url(#ochre)} .sub{font-size:15px}</style>
<rect x="1" y="1" width="478" height="388" rx="8" fill="#FFFFFF" stroke="#D3DDE7"/>

<text x="24" y="34" class="heading">Two angles determine the tip</text>
<path class="axis" d="M90 285 H425"/><path class="axis" d="M90 285 V70"/>
<text x="434" y="294">x</text><text x="66" y="75">y</text>
<path d="M90 285 H290 V95" stroke="#172B42" stroke-width="9" fill="none" stroke-linejoin="round"/>
<circle cx="90" cy="285" r="8" fill="#FFFFFF" stroke="#172B42" stroke-width="3"/><circle cx="290" cy="285" r="8" fill="#FFFFFF" stroke="#172B42" stroke-width="3"/><circle cx="290" cy="95" r="8" fill="#966007"/>
<text x="117" y="268">l<tspan class="sub" baseline-shift="sub">1</tspan> = 1 m</text><text x="309" y="205">l<tspan class="sub" baseline-shift="sub">2</tspan> = 1 m</text>
<path class="guide" d="M290 285 H355"/><path class="highlight" d="M344 285 A54 54 0 0 0 290 231"/>
<text x="352" y="253" class="ochre">q<tspan class="sub" baseline-shift="sub">2</tspan></text><text x="102" y="321" class="ochre">q<tspan class="sub" baseline-shift="sub">1</tspan> = 0</text>
<path class="velocity" d="M290 95 L170 55"/><text x="136" y="83" class="blue">v</text>
<path class="velocity" d="M290 95 L278 203" stroke-dasharray="7 5"/><text x="232" y="183" class="blue">a</text>
<text x="304" y="85" class="ochre">P (1, 1) m</text>
<text x="24" y="365" class="muted">v and a use separate schematic scales.</text>

</svg>