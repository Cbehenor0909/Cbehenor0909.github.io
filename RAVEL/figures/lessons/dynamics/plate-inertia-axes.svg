<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" role="img" aria-labelledby="title desc">
<title id="title">A plate and its reference axes</title><desc id="desc">A uniform two by one meter plate has COM C. Point O is one meter to the right. The y axes through C and O are parallel and separated, whereas both x axes lie on the same line. A marked mass element illustrates perpendicular distance to the x axis.</desc>
<defs>
<marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#172B42"/></marker>
<marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2269B0"/></marker>
<marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B93C3B"/></marker>
<marker id="ochre" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#966007"/></marker>
</defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;font-size:20px;fill:#172B42} .heading{font-size:22px;font-weight:600} .muted{fill:#56697C} .blue{fill:#2269B0} .red{fill:#B93C3B} .ochre{fill:#966007} .axis{stroke:#172B42;stroke-width:2;fill:none;marker-end:url(#dark)} .geometry{stroke:#172B42;stroke-width:3;fill:#EAF0F6} .velocity{stroke:#2269B0;stroke-width:3;fill:none;marker-end:url(#blue)} .force{stroke:#B93C3B;stroke-width:3;fill:none;marker-end:url(#red)} .guide{stroke:#A9B8C7;stroke-width:1.8;stroke-dasharray:6 5;fill:none} .highlight{stroke:#966007;stroke-width:3;fill:none;marker-end:url(#ochre)} .sub{font-size:15px}</style>
<rect x="1" y="1" width="478" height="418" rx="8" fill="#FFFFFF" stroke="#D3DDE7"/>

<text x="24" y="34" class="heading">Shift the point; check which axis moves</text>
<rect x="75" y="145" width="320" height="160" class="geometry"/>
<path class="axis" d="M50 225 H445"/><text x="446" y="250">x</text>
<path class="axis" d="M235 321 V80"/><path class="axis" d="M395 321 V80"/>
<text x="216" y="72">y at C</text><text x="356" y="72">y at O</text>
<circle cx="235" cy="225" r="7" fill="#966007"/><text x="212" y="252" class="ochre">C</text><circle cx="395" cy="225" r="5" fill="#172B42"/><text x="405" y="218">O</text>
<circle cx="330" cy="174" r="5" fill="#172B42"/><text x="333" y="161">dm</text>
<path class="guide" d="M330 174 V225"/><text x="337" y="204">d<tspan class="sub" baseline-shift="sub">⊥</tspan></text>
<path d="M235 281 H395 M235 275 V287 M395 275 V287" fill="none" stroke="#966007" stroke-width="2"/><text x="273" y="273" class="ochre">1 m shift</text>
<path d="M75 348 H395 M75 341 V355 M395 341 V355" fill="none" stroke="#56697C" stroke-width="2"/><text x="194" y="374">a = 2 m</text>
<text x="24" y="410" class="muted">b = 1 m; M = 3 kg; z out of page.</text>

</svg>