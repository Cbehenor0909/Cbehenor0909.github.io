<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="title desc">
<title id="title">Area centroid of a uniform triangular plate</title><desc id="desc">A uniform triangular plate has vertices zero zero, three zero, and zero three meters. Dashed medians intersect at C equal to one one meters. A vertical area strip has height three minus x and contributes according to its area, rather than only its endpoints.</desc>
<defs>
<marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#172B42"/></marker>
<marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2269B0"/></marker>
<marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B93C3B"/></marker>
<marker id="ochre" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#966007"/></marker>
</defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;font-size:20px;fill:#172B42} .heading{font-size:22px;font-weight:600} .muted{fill:#56697C} .blue{fill:#2269B0} .red{fill:#B93C3B} .ochre{fill:#966007} .axis{stroke:#172B42;stroke-width:2;fill:none;marker-end:url(#dark)} .geometry{stroke:#172B42;stroke-width:3;fill:#EAF0F6} .velocity{stroke:#2269B0;stroke-width:3;fill:none;marker-end:url(#blue)} .force{stroke:#B93C3B;stroke-width:3;fill:none;marker-end:url(#red)} .guide{stroke:#A9B8C7;stroke-width:1.8;stroke-dasharray:6 5;fill:none} .highlight{stroke:#966007;stroke-width:3;fill:none;marker-end:url(#ochre)} .sub{font-size:15px}</style>
<rect x="1" y="1" width="478" height="398" rx="8" fill="#FFFFFF" stroke="#D3DDE7"/>

<text x="24" y="34" class="heading">Average the area, not selected markers</text>
<path d="M80 316 V76 L320 316 Z" class="geometry"/>
<path class="axis" d="M80 316 H412"/><path class="axis" d="M80 316 V52"/>
<text x="427" y="322">x</text><text x="52" y="66">y</text>
<path class="guide" d="M80 76 L200 316 M320 316 L80 196"/>
<path d="M197 193 L205 201 V316 H197 Z" fill="#2269B0" opacity="0.25"/>
<path d="M201 193 V316" stroke="#2269B0" stroke-width="2"/>
<text x="229" y="220" class="blue">Area strip</text><text x="229" y="248" class="blue">height 3 − x</text>
<circle cx="160" cy="236" r="7" fill="#966007"/><text x="94" y="223" class="ochre">C (1, 1)</text>
<text x="33" y="342">(0, 0)</text><text x="314" y="342">(3, 0) m</text><text x="94" y="86">(0, 3) m</text>
<text x="24" y="383" class="muted">Uniform density: area centroid = mass center.</text>

</svg>
