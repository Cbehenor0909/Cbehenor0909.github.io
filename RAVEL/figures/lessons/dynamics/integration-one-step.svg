<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" width="480" height="410" role="img" aria-labelledby="title desc">
<title id="title">A one-step numerical update in state space</title><desc id="desc">Position is on the horizontal axis and velocity on the vertical axis. From x equal to one and v zero, forward Euler stays at x one while velocity decreases to minus zero point four. RK4 nearly overlaps the exact endpoint at x zero point nine eight zero zero six seven and v minus zero point three nine seven three three nine. Straight arrows denote updates, not solution trajectories.</desc>
<defs>
<marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#172B42"/></marker>
<marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2269B0"/></marker>
<marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B93C3B"/></marker>
<marker id="ochre" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#966007"/></marker>
</defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;font-size:20px;fill:#172B42} .heading{font-size:22px;font-weight:600} .muted{fill:#56697C} .blue{fill:#2269B0} .red{fill:#B93C3B} .ochre{fill:#966007} .axis{stroke:#172B42;stroke-width:2;fill:none;marker-end:url(#dark)} .geometry{stroke:#172B42;stroke-width:3;fill:#EAF0F6} .velocity{stroke:#2269B0;stroke-width:3;fill:none;marker-end:url(#blue)} .force{stroke:#B93C3B;stroke-width:3;fill:none;marker-end:url(#red)} .guide{stroke:#A9B8C7;stroke-width:1.8;stroke-dasharray:6 5;fill:none} .highlight{stroke:#966007;stroke-width:3;fill:none;marker-end:url(#ochre)} .sub{font-size:15px}</style>
<rect x="1" y="1" width="478" height="408" rx="8" fill="#FFFFFF" stroke="#D3DDE7"/>

<text x="24" y="34" class="heading">A time step changes the whole state</text>
<path class="axis" d="M71 318 H437"/><path class="axis" d="M71 318 V63"/>
<text x="281" y="355">Position x (m)</text><text x="24" y="67">v (m/s)</text>
<path class="guide" d="M71 93 H390 M71 291 H390 M241 93 V318 M390 93 V318"/>
<text x="45" y="98">0</text><text x="12" y="296">−0.4</text><text x="217" y="339">0.98</text><text x="385" y="339">1</text>
<circle cx="390" cy="93" r="7" fill="#966007"/><text x="275" y="79" class="ochre">Initial state</text>
<path class="velocity" d="M390 103 V280" stroke-dasharray="7 5"/><circle cx="390" cy="291" r="7" fill="#FFFFFF" stroke="#2269B0" stroke-width="3"/>
<text x="396" y="244" class="blue">Euler</text>
<path class="velocity" d="M386 101 L247 280"/><circle cx="241" cy="290" r="7" fill="#2269B0"/>
<text x="109" y="224" class="blue">RK4 ≈ exact</text>
<text x="24" y="387" class="muted">One 0.1 s step; arrows are updates, not paths.</text>

</svg>