<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 630" role="img" aria-labelledby="title desc">
  <title id="title">Observer-based feedback uses a known input and measured position</title>
  <desc id="desc">Signal schematic for the worked double integrator with controller u equals minus K times estimated state plus six r. The controller input is reference r and the observer's estimated position and velocity. Control u goes to both the plant and the observer. Measured position y equals q goes from the plant to the observer; innovation y minus estimated q corrects the model. The estimated state returns to the controller. K equals six comma five places feedback poles at minus two and minus three. Observer gain seventeen comma seventy-two places error poles at minus eight and minus nine. The exact nominal augmented system has the union of these poles.</desc>
  <defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2269B0"/></marker></defs>
  <rect width="480" height="630" rx="8" fill="#FFFFFF"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172B42">
    <text x="24" y="35" font-size="24" font-weight="600">Estimate, then feed back the state</text>
    <rect x="125" y="70" width="290" height="90" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="1.8"/><text x="270" y="103" text-anchor="middle" font-weight="600">Controller</text><text x="270" y="139" text-anchor="middle">u = −K x̂ + 6r</text>
    <text x="53" y="107">r</text><path d="M72 112H120" fill="none" stroke="#2269B0" stroke-width="2.5" marker-end="url(#flow)"/>
    <path d="M270 160V209" fill="none" stroke="#2269B0" stroke-width="2.5" marker-end="url(#flow)"/><text x="288" y="193">u</text><circle cx="270" cy="185" r="3.5" fill="#2269B0"/>
    <rect x="125" y="215" width="290" height="75" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="1.8"/><text x="270" y="246" text-anchor="middle" font-weight="600">Plant</text><text x="270" y="276" text-anchor="middle">Acceleration → velocity → q</text>
    <path d="M270 185H104M88 185H62V425H119" fill="none" stroke="#2269B0" stroke-width="2.5" marker-end="url(#flow)"/><text x="22" y="328">known</text><text x="43" y="355">u</text>
    <path d="M270 290V337H449V425H421" fill="none" stroke="#2269B0" stroke-width="2.5" marker-end="url(#flow)"/><text x="288" y="317">y = q</text><text x="287" y="362">measurement</text>
    <rect x="125" y="375" width="290" height="105" rx="4" fill="#FFFFFF" stroke="#966007" stroke-width="2"/><text x="270" y="405" text-anchor="middle" font-weight="600">Observer model</text><text x="270" y="438" text-anchor="middle">Predict with known u</text><text x="270" y="466" text-anchor="middle">Correct with y − q̂</text>
    <path d="M270 480V530H96V148H119" fill="none" stroke="#2269B0" stroke-width="2.5" marker-end="url(#flow)"/>
    <text x="240" y="563" text-anchor="middle">Estimated state x̂ = [q̂, v̂]<tspan dy="-7" font-size="14">T</tspan></text>
    <text x="24" y="594">Feedback poles: −2, −3</text><text x="24" y="621">Observer error poles: −8, −9</text>
  </g>
</svg>
