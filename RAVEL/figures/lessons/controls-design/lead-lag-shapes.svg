<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="title desc">
  <title id="title">Lead supplies positive phase while normalized lag increases low-frequency gain</title><desc id="desc">Analytic model curves for lead shape (one plus s) over (one plus 0.25 s), excluding scalar controller gain Kc, and normalized lag five times (one plus ten s) over (one plus fifty s). Each curve contains 241 logarithmic samples from 0.01 to 100 radians per second evaluated by src/lib/figures/controlExamples.ts. The upper magnitude panel ranges from zero to fifteen decibels; the phase panel ranges from minus fifty to plus fifty degrees. Blue solid lead has maximum phase 36.87 degrees at two radians per second, and its high-frequency gain tends to four. Dark dashed lag has minimum phase minus 41.81 degrees at 0.04472 radians per second, DC gain five and high-frequency gain one. The sampled lower endpoint is not DC. SVG coordinates only project the independently tested data.</desc>
