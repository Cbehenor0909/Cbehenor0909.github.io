<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="title desc">
  <title id="title">Exact Bode curves and phase margin for two over s times s plus one</title><desc id="desc">Loop-transfer frequency response L equals two over s times s plus one under negative unity feedback. Blue model curves use 161 analytic logarithmic samples from 0.1 to 10 radians per second, evaluated by src/lib/figures/controlExamples.ts. The upper panel is magnitude in decibels and the lower panel is phase in degrees on a common logarithmic frequency axis. Gain crossover is approximately 1.250 radians per second, where magnitude is zero decibels and phase is minus 141.332 degrees. The vertical separation from minus 180 degrees is phase margin 38.668 degrees. There is no finite minus-180-degree phase crossover for this particular loop; the conventional gain margin is infinite. Plot projection is separate from the tested analytic functions.</desc>
