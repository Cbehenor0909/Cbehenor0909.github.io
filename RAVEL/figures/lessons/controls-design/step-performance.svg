<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" role="img" aria-labelledby="title desc">
  <title id="title">Exact unit-step response of four over s squared plus two s plus four</title><desc id="desc">Blue model curve for T equals four over s squared plus two s plus four, sampled analytically at 201 equally spaced times from zero to eight seconds by src/lib/figures/controlExamples.ts. The first peak is at 1.8138 seconds with response 1.1630. The final value is one. An ochre band marks plus or minus two percent of final value. A vertical line at four seconds marks the standard approximate settling estimate, not the exact last band crossing. Curve coordinates are a projection of the tested analytic samples; the SVG does not implement a dynamics model.</desc>
