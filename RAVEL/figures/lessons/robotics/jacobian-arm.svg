<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
  <title id="title">One arm, two Jacobian maps</title>
  <desc id="desc">A two-link planar arm with a thirty-degree shoulder and sixty-degree relative elbow angle. The tool moves up and left, while a separate force points up and right. The tip, force and velocity share the world frame.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2269B0"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B93C3B"/></marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56697C"/></marker>
  </defs>
  <rect width="480" height="430" fill="#FFFFFF"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172B42">
    <text x="24" y="31" font-size="23" font-weight="600">Joint motion ↔ tool motion</text>
    <path d="M70 360H435" fill="none" stroke="#56697C" stroke-width="2" marker-end="url(#axis)"/>
    <path d="M70 360V72" fill="none" stroke="#56697C" stroke-width="2" marker-end="url(#axis)"/>
    <text x="434" y="386">x</text><text x="45" y="80">y</text>
    <path d="M70 360L247 258L247 122" fill="none" stroke="#172B42" stroke-width="12" stroke-linecap="round"/>
    <path d="M247 258H312" stroke="#56697C" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="70" cy="360" r="10" fill="#FFFFFF" stroke="#172B42" stroke-width="3"/>
    <circle cx="247" cy="258" r="10" fill="#FFFFFF" stroke="#172B42" stroke-width="3"/>
    <circle cx="247" cy="122" r="8" fill="#966007"/>
    <path d="M247 122L198 71" stroke="#2269B0" stroke-width="4" marker-end="url(#blue)"/>
    <path d="M247 122L315 71" stroke="#B93C3B" stroke-width="4" marker-end="url(#red)"/>
    <text x="159" y="72" fill="#2269B0">v</text><text x="326" y="72" fill="#B93C3B">F</text>
    <text x="259" y="147">tool T</text><text x="55" y="391">O</text>
    <text x="91" y="276">l₁ = 0.6 m</text><text x="267" y="207">l₂ = 0.4 m</text>
    <text x="106" y="351">q₁ = 30°</text><text x="280" y="287">q₂ = 60°</text>
    <text x="24" y="420" fill="#56697C">Schematic · arrows use separate scales</text>
  </g>
</svg>
