<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="title desc">
  <title id="title">Impedance and admittance have different signal directions</title>
  <desc id="desc">In impedance implementation, motion error enters a virtual interaction law which commands force or torque. In admittance implementation, sensed force enters a virtual dynamic model which commands motion to an inner servo.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2269B0"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B93C3B"/></marker>
  </defs>
  <rect width="480" height="460" fill="#FFFFFF"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172B42">
    <text x="24" y="32" font-size="23" font-weight="600">Choose the causal interface</text>
    <text x="24" y="84" font-weight="600">Impedance implementation</text>
    <rect x="140" y="104" width="194" height="76" rx="4" fill="#F6F8FB" stroke="#56697C" stroke-width="2"/>
    <text x="237" y="136" text-anchor="middle">Virtual spring,</text><text x="237" y="164" text-anchor="middle">damper / inertia</text>
    <text x="24" y="128" fill="#2269B0">Motion</text><text x="24" y="156" fill="#2269B0">error</text>
    <path d="M88 145H135" stroke="#2269B0" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M334 145H380" stroke="#B93C3B" stroke-width="3" marker-end="url(#red)"/>
    <text x="388" y="135" fill="#B93C3B">Effort</text><text x="295" y="205">Torque interface</text>
    <text x="24" y="259" font-weight="600">Admittance implementation</text>
    <rect x="140" y="282" width="194" height="76" rx="4" fill="#F6F8FB" stroke="#56697C" stroke-width="2"/>
    <text x="237" y="313" text-anchor="middle">Integrate virtual</text><text x="237" y="341" text-anchor="middle">dynamic model</text>
    <text x="24" y="307" fill="#B93C3B">Sensed</text><text x="24" y="335" fill="#B93C3B">force</text>
    <path d="M88 323H135" stroke="#B93C3B" stroke-width="3" marker-end="url(#red)"/>
    <path d="M334 323H375" stroke="#2269B0" stroke-width="3" marker-end="url(#blue)"/>
    <text x="385" y="307" fill="#2269B0">Motion</text><text x="385" y="335" fill="#2269B0">target</text>
    <text x="275" y="388">Inner motion servo</text>
    <text x="24" y="444" fill="#56697C">Schematic · interface dynamics still matter</text>
  </g>
</svg>
