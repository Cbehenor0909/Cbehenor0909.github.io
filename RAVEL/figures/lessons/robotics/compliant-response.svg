<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
  <title id="title">A five-newton push on a virtual mass spring damper</title>
  <desc id="desc">A one-kilogram virtual mass is attached to a fixed reference by a spring of one hundred newtons per meter and a damper of twenty newton seconds per meter. A positive five-newton force yields initial acceleration five meters per second squared and final displacement five centimeters.</desc>
  <defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B93C3B"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2269B0"/></marker></defs>
  <rect width="480" height="410" fill="#FFFFFF"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172B42">
    <text x="24" y="33" font-size="23" font-weight="600">A designed compliant response</text>
    <path d="M60 99V270" stroke="#172B42" stroke-width="5"/>
    <path d="M60 132H81L91 119L108 145L125 119L142 145L159 119L176 145L188 132H240" fill="none" stroke="#172B42" stroke-width="3"/>
    <path d="M60 230H119M153 217V244M119 217H164V244H119Z M164 230H240" fill="none" stroke="#172B42" stroke-width="3"/>
    <rect x="240" y="110" width="96" height="145" rx="4" fill="#EAF0F6" stroke="#172B42" stroke-width="3"/>
    <text x="288" y="172" text-anchor="middle">M = 1</text><text x="288" y="200" text-anchor="middle">kg</text>
    <path d="M336 184H447" stroke="#B93C3B" stroke-width="4" marker-end="url(#red)"/>
    <text x="350" y="165" fill="#B93C3B">F = 5 N</text>
    <path d="M240 290H337" stroke="#2269B0" stroke-width="3" marker-end="url(#blue)"/>
    <text x="351" y="295" fill="#2269B0">+x</text>
    <text x="77" y="97">K = 100 N/m</text><text x="75" y="270">D = 20 N·s/m</text>
    <text x="24" y="344">Initially: a = 5 m/s²</text>
    <text x="24" y="376">Eventually: e = 0.05 m</text>
    <text x="24" y="405" fill="#56697C">Ideal fixed-reference model · schematic</text>
  </g>
</svg>
