<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 535" role="img" aria-labelledby="title desc">
  <title id="title">The sampled sensing-to-actuation loop</title>
  <desc id="desc">A continuous plant feeds an analog filter and ADC sampler. A digital estimator and PD controller produce a command that passes through delay, a saturation clamp and zero-order hold before becoming the actual plant force.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2269B0"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087478"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B93C3B"/></marker>
  </defs>
  <rect width="480" height="535" fill="#FFFFFF"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172B42">
    <text x="24" y="32" font-size="23" font-weight="600">The controller sees snapshots</text>
    <g fill="#F6F8FB" stroke="#56697C" stroke-width="2">
      <rect x="25" y="92" width="190" height="76" rx="4"/><rect x="265" y="92" width="190" height="76" rx="4"/>
      <rect x="265" y="235" width="190" height="76" rx="4"/><rect x="265" y="378" width="190" height="76" rx="4"/>
      <rect x="25" y="378" width="190" height="76" rx="4"/><rect x="25" y="235" width="190" height="76" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="120" y="122" fill="#087478">Analog filter</text><text x="120" y="150" fill="#087478">+ ADC sampler</text>
      <text x="360" y="122" fill="#2269B0">Position →</text><text x="360" y="150" fill="#2269B0">velocity estimate</text>
      <text x="360" y="265" fill="#2269B0">Digital PD</text><text x="360" y="293" fill="#2269B0">+ reference</text>
      <text x="360" y="408">Processing /</text><text x="360" y="436">transport delay</text>
      <text x="120" y="408" fill="#B93C3B">Clamp + hold</text><text x="120" y="436" fill="#B93C3B">actual force</text>
      <text x="120" y="265">Continuous</text><text x="120" y="293">mechanism</text>
    </g>
    <path d="M215 130H260" stroke="#087478" stroke-width="3" marker-end="url(#teal)"/>
    <path d="M360 168V230" stroke="#2269B0" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M360 311V373" stroke="#2269B0" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M265 416H220" stroke="#B93C3B" stroke-width="3" marker-end="url(#red)"/>
    <path d="M120 378V316" stroke="#B93C3B" stroke-width="3" marker-end="url(#red)"/>
    <path d="M120 235V173" stroke="#087478" stroke-width="3" marker-end="url(#teal)"/>
    <text x="24" y="496">Sampling ≠ filtering ≠ delay</text>
    <text x="24" y="525" fill="#56697C">Schematic · label every clock and signal</text>
  </g>
</svg>
