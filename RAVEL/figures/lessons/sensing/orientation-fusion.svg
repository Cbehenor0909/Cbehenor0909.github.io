<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 545" role="img" aria-labelledby="title desc">
  <title id="title">Orientation prediction and reference corrections</title>
  <desc id="desc">Symbolic gyroscope, accelerometer and optional magnetometer measurements support rate prediction, tilt correction and heading correction. The estimate feeds the next prediction. Motion and field disturbances limit reference interpretation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56697C"/></marker></defs>
  <rect width="480" height="545" fill="#FFFFFF"/>
  <g font-family="system-ui,sans-serif" font-size="20" fill="#172B42">
    <text x="240" y="29" text-anchor="middle" font-weight="600">Predict, then constrain</text>
    <text x="120" y="61" text-anchor="middle" fill="#087478">Symbolic measurements</text>
    <rect x="18" y="77" width="204" height="73" rx="6" fill="#FFFFFF" stroke="#087478" stroke-width="2"/>
    <text x="120" y="107" text-anchor="middle">Gyroscope</text><text x="120" y="135" text-anchor="middle" fill="#087478">Angular rate</text>
    <rect x="276" y="77" width="186" height="73" rx="6" fill="#EAF0F6" stroke="#2269B0" stroke-width="2"/>
    <text x="369" y="107" text-anchor="middle">Predict</text><text x="369" y="135" text-anchor="middle" fill="#2269B0">Integrate rate</text>
    <path d="M228 114H266" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="18" y="190" width="204" height="73" rx="6" fill="#FFFFFF" stroke="#087478" stroke-width="2"/>
    <text x="120" y="220" text-anchor="middle">Accelerometer</text><text x="120" y="248" text-anchor="middle" fill="#087478">Specific force</text>
    <rect x="276" y="190" width="186" height="73" rx="6" fill="#EAF0F6" stroke="#2269B0" stroke-width="2"/>
    <text x="369" y="220" text-anchor="middle">Constrain tilt</text><text x="369" y="248" text-anchor="middle">Gravity model</text>
    <path d="M228 226H266" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M369 155V180" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="120" y="293" text-anchor="middle" fill="#B93C3B">Motion can imitate tilt.</text>
    <rect x="18" y="328" width="204" height="73" rx="6" fill="#FFFFFF" stroke="#087478" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="120" y="358" text-anchor="middle">Magnetometer</text><text x="120" y="386" text-anchor="middle" fill="#087478">Optional reference</text>
    <rect x="276" y="328" width="186" height="73" rx="6" fill="#EAF0F6" stroke="#2269B0" stroke-width="2"/>
    <text x="369" y="358" text-anchor="middle">Constrain heading</text><text x="369" y="386" text-anchor="middle">Field model</text>
    <path d="M228 364H266" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M369 268V318" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="120" y="434" text-anchor="middle" fill="#B93C3B">Check disturbances.</text>
    <path d="M369 406V447" fill="none" stroke="#56697C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="276" y="457" width="186" height="61" rx="6" fill="#EAF0F6" stroke="#2269B0" stroke-width="2"/>
    <text x="369" y="482" text-anchor="middle" fill="#2269B0">Orientation</text><text x="369" y="507" text-anchor="middle" fill="#2269B0">estimate</text>
    <path d="M462 488H473V114H462" fill="none" stroke="#56697C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="118" y="493" text-anchor="middle" fill="#56697C">Next step uses</text><text x="118" y="520" text-anchor="middle" fill="#56697C">the updated estimate.</text>
  </g>
</svg>
